name: Release macOS

# Builds and packages Magic Mirror for macOS (Apple Silicon + Intel).
# - Tag push (v*): validate, package, verify, then publish a draft GitHub Release.
# - workflow_dispatch: build + verify only, no publishing.
#
# Unsigned archives for now. Signing, notarization, a universal binary, and
# macOS autostart are separate follow-up work.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@b4ffde65f46336ab580fc749b1466681cd909d9c # v4.2.2

      - name: Set up Rust
        uses: actions/setup-rust@5e57d8bf1c621863884224a136b113d66b6e4216 # v1.7.0
        with:
          toolchain: stable

      - name: Check tag version matches Cargo.toml
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -n1)
          echo "tag version:    $tag_version"
          echo "Cargo.toml:     $cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag v$tag_version does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package distribution
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -n1)
          pkg="magic-mirror-${version}-${{ matrix.arch }}"
          stage="dist/${pkg}"
          mkdir -p "${stage}/config"
          cp target/release/magic-mirror "${stage}/magic-mirror"
          cp -R static "${stage}/static"
          cp config/mirror.example.toml "${stage}/config/mirror.example.toml"
          cat > "${stage}/STARTUP.md" <<'EOF'
          # Magic Mirror

          A read-only, always-on dashboard for a portrait display: calendar,
          weather and air quality, transit, and news.

          ## Run

          The binary loads its assets relative to the working directory, so
          start it from this extracted folder:

              ./magic-mirror

          Then open http://127.0.0.1:3000 in a browser.

          ## Configure (optional)

          Copy the example config and edit it:

              cp config/mirror.example.toml config/mirror.toml

          Secrets are environment variables only (for example
          MIRROR_CALDAV_APP_PASSWORD). Never put secrets in the config file.

          ## Stop

          Press Ctrl+C, or kill the process.
          EOF
          tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
          echo "Packaged dist/${pkg}.tar.gz"

      - name: Verify extracted archive
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -n1)
          pkg="magic-mirror-${version}-${{ matrix.arch }}"
          archive="dist/${pkg}.tar.gz"
          workdir=$(mktemp -d)
          pid=""
          cleanup() {
            if [ -n "${pid}" ]; then kill "${pid}" 2>/dev/null || true; fi
            rm -rf "${workdir}"
          }
          trap cleanup EXIT
          tar -xzf "${archive}" -C "${workdir}"
          cd "${workdir}/${pkg}"
          ./magic-mirror > server.log 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then ready=1; break; fi
            sleep 0.5
          done
          if [ "${ready}" -ne 1 ]; then
            echo "::error::Packaged binary did not start"
            cat server.log
            exit 1
          fi
          curl -sf http://127.0.0.1:3000/ | grep -q '<title>Magic Mirror</title>'
          curl -sf http://127.0.0.1:3000/assets/style.css -o /dev/null
          curl -sf http://127.0.0.1:3000/api/v1/dashboard | grep -q '"weather"'
          echo "Verified: /, static asset, and /api/v1/dashboard all respond"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          shasum -a 256 magic-mirror-*-${{ matrix.arch }}.tar.gz > "SHA256SUMS.${{ matrix.arch }}"
          cat "SHA256SUMS.${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@24e95e90e7278084a9d1c558b73ee2e80f9d1580 # v4.6.0
        with:
          name: magic-mirror-${{ matrix.arch }}
          path: |
            dist/magic-mirror-*-${{ matrix.arch }}.tar.gz
            dist/SHA256SUMS.${{ matrix.arch }}
          if-no-files-found: error

  publish:
    name: Publish draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download Apple Silicon artifacts
        uses: actions/download-artifact@cc20c321ba964b0bfe22e2b6fc2d1c341be53fc9 # v4.3.0
        with:
          name: magic-mirror-aarch64-apple-darwin
          path: dist

      - name: Download Intel artifacts
        uses: actions/download-artifact@cc20c321ba964b0bfe22e2b6fc2d1c341be53fc9 # v4.3.0
        with:
          name: magic-mirror-x86_64-apple-darwin
          path: dist

      - name: Combine checksums
        shell: bash
        run: |
          cat "dist/SHA256SUMS.aarch64-apple-darwin" "dist/SHA256SUMS.x86_64-apple-darwin" > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@1e07f439802f0c76bd572d761c4df10247b203d1 # v2.4.0
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: false
          files: |
            dist/magic-mirror-*-aarch64-apple-darwin.tar.gz
            dist/magic-mirror-*-x86_64-apple-darwin.tar.gz
            dist/SHA256SUMS
          body: |
            Magic Mirror ${{ github.ref_name }} for macOS.

            - `magic-mirror-*-aarch64-apple-darwin.tar.gz` — Apple Silicon
            - `magic-mirror-*-x86_64-apple-darwin.tar.gz` — Intel

            Extract, then run `./magic-mirror` from the extracted folder and
            open http://127.0.0.1:3000. See `STARTUP.md` inside each archive.

            Archives are unsigned and not notarized. Verify with
            `shasum -a 256 -c SHA256SUMS`.
